name: Build E404 Kernel with KSU-Next 33188+

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Clean Legacy Driver Directories
        run: |
          rm -rf drivers/kernelsu KernelSU || true
          git rm -rf drivers/kernelsu KernelSU || true

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make libc6-dev libncurses5-dev libelf-dev clang lld llvm git curl zip gcc-aarch64-linux-gnu

      - name: Patch KernelSU-Next Driver (33188+)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Inject Defconfig Flags for Munch
        run: |
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vendor/munch_user_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vendor/munch_user_defconfig
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> arch/arm64/configs/vendor/munch_user_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/munch_user_defconfig

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out vendor/munch_user_defconfig
          make -j$(nproc) O=out

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E404-KSUNext-munch
          path: out/arch/arm64/boot/Image.gz-dtb
          
