name: Build E404 Kernel with KSU-Next 33188+

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Clean Legacy Drivers
        run: |
          rm -rf drivers/kernelsu KernelSU drivers/drivers/kernelsu || true

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make libc6-dev libncurses5-dev libelf-dev clang lld llvm git curl zip gcc-aarch64-linux-gnu

      - name: Patch KernelSU-Next Driver (33188+)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Inject Defconfig Flags
        run: |
          DEFCONFIG="arch/arm64/configs/munch_user_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/vendor/munch_user_defconfig"
          fi
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-

          if [ -f "arch/arm64/configs/munch_user_defconfig" ]; then
            make O=out munch_user_defconfig
          else
            make O=out vendor/munch_user_defconfig
          fi

          make -j$(nproc) O=out

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E404-KSUNext-munch
          path: out/arch/arm64/boot/Image.gz-dtb
          
